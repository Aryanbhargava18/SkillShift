<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillShift from Scratch</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#fbfbfa; --panel:#f3f3f1; --fg:#17181b; --muted:#5d6066; --line:#e4e4e0;
    --accent:#1f5fd6; --accent-soft:#eaf0fc; --code-bg:#f2f3f5;
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#101216; --panel:#191c21; --fg:#e8eaed; --muted:#9aa0a8; --line:#282c33;
    --accent:#6ea0ff; --accent-soft:#17233b; --code-bg:#1a1d23; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#101216; --panel:#191c21; --fg:#e8eaed; --muted:#9aa0a8; --line:#282c33;
    --accent:#6ea0ff; --accent-soft:#17233b; --code-bg:#1a1d23; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.7;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.7rem max(16px,env(safe-area-inset-left,0px));}
  .topbar .brand{font-family:var(--display);font-weight:700;letter-spacing:-.01em;font-size:1rem;color:var(--fg)}
  .topbar a.back{font-size:.85rem;color:var(--muted)}
  .shell{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:2.4rem;
    padding:0 max(16px,env(safe-area-inset-left,0px)) 5rem}
  /* table of contents */
  nav.toc{position:sticky;top:3.4rem;align-self:start;max-height:calc(100vh - 4.5rem);overflow:auto;
    padding:1.4rem .4rem 2rem 0;font-size:.86rem}
  nav.toc .lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;
    color:var(--muted);margin:0 0 .7rem}
  nav.toc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.1rem}
  nav.toc a{display:block;padding:.28rem .6rem;border-radius:6px;color:var(--muted);border-left:2px solid transparent;line-height:1.35}
  nav.toc a:hover{color:var(--fg);background:var(--panel);text-decoration:none}
  nav.toc a.h2{color:var(--fg);font-weight:600;font-family:var(--display);margin-top:.5rem}
  nav.toc a.h3{padding-left:1.2rem;font-size:.82rem}
  nav.toc a.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
  /* article */
  main{min-width:0;padding-top:1.4rem}
  .lede{max-width:46rem}
  article{max-width:46rem}
  article h2{font-family:var(--display);font-size:clamp(1.5rem,3.5vw,2rem);font-weight:700;letter-spacing:-.015em;
    line-height:1.2;margin:3.2rem 0 1rem;padding-top:1rem;border-top:1px solid var(--line);text-wrap:balance}
  article h2:first-of-type{border-top:none;margin-top:1rem;padding-top:0}
  article h3{font-family:var(--display);font-size:1.2rem;font-weight:600;margin:2rem 0 .6rem;line-height:1.3}
  article p{margin:0 0 1.05rem}
  article ul,article ol{margin:0 0 1.15rem;padding-left:1.3rem}
  article li{margin:.3rem 0}
  article strong{font-weight:600}
  article code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:.1em .38em;border-radius:5px}
  article pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;
    overflow-x:auto;margin:0 0 1.3rem;font-size:.86rem;line-height:1.5}
  article pre code{background:none;padding:0;font-size:1em}
  article blockquote{margin:0 0 1.2rem;padding:.2rem 0 .2rem 1.1rem;border-left:3px solid var(--accent);color:var(--fg)}
  article img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    padding:.9rem;margin:.6rem 0 1.4rem}
  article table{width:100%;border-collapse:collapse;margin:0 0 1.4rem;font-size:.9rem;display:block;overflow-x:auto}
  article th,article td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
  article th{background:var(--panel);font-family:var(--display);font-weight:600}
  article h2 .anchor{opacity:0;margin-left:.4rem;font-size:.7em;color:var(--muted);text-decoration:none}
  article h2:hover .anchor,article h3:hover .anchor{opacity:1}
  .loading{color:var(--muted);padding:3rem 0}
  details.mtoc{display:none}
  @media (max-width:820px){
    .shell{grid-template-columns:1fr;gap:0}
    nav.toc{display:none}
    details.mtoc{display:block;margin:1.2rem 0 .5rem;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
    details.mtoc summary{cursor:pointer;padding:.7rem 1rem;font-family:var(--display);font-weight:600}
    details.mtoc .inner{padding:0 1rem 1rem}
    details.mtoc a{display:block;padding:.25rem 0;color:var(--muted)}
    details.mtoc a.h3{padding-left:1rem;font-size:.85rem}
  }
</style>
</head>
<body>
  <header class="topbar">
    <span class="brand">SkillShift from Scratch</span>
    <a class="back" href="./">← project hub</a>
  </header>
  <div class="shell">
    <nav class="toc" aria-label="Contents"><p class="lbl">Contents</p><ul id="toc"></ul></nav>
    <main>
      <details class="mtoc"><summary>Contents</summary><div class="inner" id="mtoc"></div></details>
      <article id="content"><p class="loading">Loading the handbook…</p></article>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    function slug(s){return s.toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").slice(0,60);}
    fetch("handbook.md").then(r=>r.text()).then(src=>{
      const content=document.getElementById("content");
      content.innerHTML=marked.parse(src);
      const heads=[...content.querySelectorAll("h2, h3")];
      const toc=document.getElementById("toc"), mtoc=document.getElementById("mtoc");
      const used={};
      heads.forEach(h=>{
        let id=slug(h.textContent)||"s"; if(used[id]){used[id]++;id+="-"+used[id];}else used[id]=1;
        h.id=id;
        const a=document.createElement("a"); a.href="#"+id; a.textContent=h.textContent;
        a.className=h.tagName.toLowerCase(); toc.appendChild(a);
        const m=document.createElement("a"); m.href="#"+id; m.textContent=h.textContent;
        m.className=h.tagName.toLowerCase(); mtoc.appendChild(m);
        const anc=document.createElement("a"); anc.href="#"+id; anc.className="anchor"; anc.textContent="#"; h.appendChild(anc);
      });
      // active-section highlight
      const links=new Map([...toc.querySelectorAll("a")].map(a=>[a.getAttribute("href").slice(1),a]));
      const obs=new IntersectionObserver(es=>{
        es.forEach(e=>{ if(e.isIntersecting){
          links.forEach(a=>a.classList.remove("active"));
          const a=links.get(e.target.id); if(a){a.classList.add("active");
            a.scrollIntoView({block:"nearest"});}
        }});
      },{rootMargin:"0px 0px -75% 0px",threshold:0});
      heads.forEach(h=>obs.observe(h));
      if(location.hash){const el=document.getElementById(location.hash.slice(1)); if(el)el.scrollIntoView();}
    }).catch(e=>{document.getElementById("content").innerHTML="<p class='loading'>Could not load handbook.md ("+e+").</p>";});
  </script>
</body>
</html>
