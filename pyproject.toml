[project]
name = "skillshift"
version = "0.1.0"
description = "Detecting malicious agent skills from sources a model has never seen"
requires-python = ">=3.12"
# Data analysis and classical baselines.
dependencies = [
    "huggingface-hub>=2.4.0",
    "numpy>=2.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
# Fine-tuning and ONNX export.
train = [
    "accelerate>=1.15.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
# The inference service: no torch, just ONNX Runtime and a tokenizer.
serve = [
    "fastapi>=0.162.7",
    "onnxruntime>=1.32.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "tokenizers>=0.22",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.14",
]

[tool.uv]
default-groups = ["train", "serve", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillshift"]
